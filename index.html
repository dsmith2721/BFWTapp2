<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feelings Wheel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive feelings wheel: find the word for what you feel, then an idea for what to do next.">
<meta name="theme-color" content="#14122B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feelings Wheel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #F5F3FA;
    --surface: #FFFFFF;
    --ink: #1C1A33;
    --muted: #5E5B78;
    --line: #DDD9EC;
    --bar: #14122B;
    --bar-ink: #FFFFFF;
    --focus: #5E3FA3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0C20;
      --surface: #1B1936;
      --ink: #F1EFFA;
      --muted: #A9A5C8;
      --line: #2F2C54;
      --focus: #B9A6FF;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bar); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--bar);
    color: var(--bar-ink);
    padding: 14px max(16px, env(safe-area-inset-left, 0px)) 14px max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header img { width: 40px; height: 40px; border-radius: 10px; display: block; }
  header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.01em; }
  header p { margin: 0; font-size: 0.82rem; opacity: 0.75; }
  header .grow { flex: 1; min-width: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  #install {
    display: none;
    background: #fff; color: #14122B; border: 0; border-radius: 999px;
    padding: 8px 14px; font-weight: 700; font-size: 0.85rem;
  }
  #ioshint {
    display: none; margin: 12px auto 0; max-width: 760px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    font-size: 0.9rem; color: var(--muted);
  }

  main { max-width: 820px; margin: 0 auto; padding: 14px 12px 40px; }
  .tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 4px 8px; color: var(--muted); font-size: 0.9rem; }
  .zoom { display: flex; gap: 6px; }
  .zoom button {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); font-size: 1.2rem; font-weight: 700; line-height: 1;
  }
  .zoom button:disabled { opacity: 0.35; cursor: default; }

  #stage {
    overflow: auto;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    max-height: 82vh;
    -webkit-overflow-scrolling: touch;
  }
  #wheel { display: block; width: 100%; height: auto; margin: 0 auto; touch-action: manipulation; }
  .seg { cursor: pointer; transition: opacity 0.2s; }
  .seg path { stroke: #fff; stroke-width: 1.4; transition: stroke-width 0.2s; }
  .seg text { fill: #fff; stroke: rgba(0,0,0,0.22); stroke-width: 0.5px; paint-order: stroke; pointer-events: none; font-weight: 500; }
  .seg.core text { font-weight: 800; }
  .seg.dim { opacity: 0.22; }
  .seg.soft { opacity: 0.6; }
  .seg.on path { stroke-width: 4; }
  .seg.on { opacity: 1; }
  @media (prefers-color-scheme: dark) { .seg path { stroke: #1B1936; } .seg.on path { stroke: #fff; } }

  #card {
    margin-top: 14px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 16px 16px 18px;
  }
  #card .crumbs { margin: 0 0 2px; font-size: 0.86rem; color: var(--muted); }
  #card h2 { margin: 0 0 4px; font-size: 1.55rem; line-height: 1.15; }
  #card .lead { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }
  #card h3 { margin: 14px 0 8px; font-size: 0.95rem; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 0; border-radius: 999px; padding: 8px 14px; color: #fff; font-weight: 600; font-size: 0.92rem;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
  }
  .chip[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 0 16px 24px; }
  @media (prefers-reduced-motion: reduce) { .seg, .seg path { transition: none; } }
</style>
</head>
<body>

<header>
  <img id="hdrIcon" alt="" width="40" height="40">
  <div class="grow">
    <h1>Feelings Wheel</h1>
    <p>Name what you feel, then pick a next step.</p>
  </div>
  <button id="install" type="button">Install app</button>
</header>

<main>
  <div id="ioshint">To install on iPhone or iPad: tap the Share button, then choose Add to Home Screen.</div>

  <div class="tools">
    <span>Tap any word to explore it.</span>
    <div class="zoom" role="group" aria-label="Zoom">
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="zin" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>

  <div id="stage" tabindex="0" aria-label="Feelings wheel, scrollable">
    <svg id="wheel" viewBox="-505 -505 1010 1010" role="img" aria-label="Feelings wheel with four rings: core feeling, feeling, finer nuance and an idea for what to do"></svg>
  </div>

  <section id="card" aria-live="polite"></section>
</main>

<footer>Works offline once installed. Based on the feelings wheel by Dr. Gloria Willcox.</footer>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* Data (clockwise from the top)                                       */
  /* ------------------------------------------------------------------ */
  var DATA = [
    { name: "Fearful", color: "#0E9AA7",
      r2: ["Scared","Anxious","Insecure","Weak","Rejected","Threatened"],
      r3: ["Terrified","Frightened","Overwhelmed","Worried","Inadequate","Inferior","Worthless","Insignificant","Excluded","Persecuted","Nervous","Exposed"],
      r4: ["Prepare","Seek support","Plan","Be cautious","Reduce risk","Ground yourself","Breathe"] },
    { name: "Angry", color: "#5E3FA3",
      r2: ["Let down","Humiliated","Bitter","Mad","Aggressive","Frustrated","Distant","Critical"],
      r3: ["Betrayed","Resentful","Disrespected","Ridiculed","Indignant","Violated","Furious","Jealous","Provoked","Hostile","Infuriated","Annoyed","Withdrawn","Numb","Skeptical","Dismissive"],
      r4: ["Set boundaries","Confront","Speak up","Express needs","Walk away","Channel energy","Problem-solve","Get space","Redirect attention","Practice patience"] },
    { name: "Disgusted", color: "#B545B0",
      r2: ["Disapproving","Disappointed","Awful","Repelled"],
      r3: ["Judgmental","Embarrassed","Appalled","Revolted","Nauseated","Detestable","Horrified","Hesitant"],
      r4: ["Avoid","Keep distance","Cleanse","Let go","Speak honestly","Reframe","Focus on solutions","Choose differently"] },
    { name: "Sad", color: "#E0405F",
      r2: ["Hurt","Depressed","Guilty","Despair","Vulnerable","Lonely"],
      r3: ["Embarrassed","Disappointed","Inferior","Empty","Remorseful","Ashamed","Powerless","Grief","Fragile","Victimized","Abandoned","Isolated"],
      r4: ["Find kindness","Be heard","Find others","Prioritize rest","Practice self-care","Find meaning","Focus on health","Ask for help","Express feelings","Seek comfort","Reach out"] },
    { name: "Happy", color: "#F2641A",
      r2: ["Optimistic","Trusting","Peaceful","Powerful","Accepted","Proud","Interested","Content","Playful"],
      r3: ["Inspired","Hopeful","Intimate","Sensitive","Thankful","Loving","Creative","Courageous","Valued","Respected","Confident","Successful","Inquisitive","Curious","Joyful","Free","Cheeky","Aroused"],
      r4: ["Enjoy the moment","Take initiative","Pursue goals","Spread positivity","Show gratitude","Help others","Learn","Explore","Be active"] },
    { name: "Surprised", color: "#EE9A0C",
      r2: ["Excited","Amazed","Confused","Startled"],
      r3: ["Energetic","Eager","Awe","Astounded","Perplexed","Disillusioned","Dismayed","Shocked"],
      r4: ["Create","Connect","Celebrate","Stay curious"] },
    { name: "Bad", color: "#27B45B",
      r2: ["Tired","Stressed","Busy","Bored"],
      r3: ["Unfocused","Sleepy","Out of control","Overwhelmed","Rushed","Pressured","Apathetic","Indifferent"],
      r4: ["Let go","Seek clarity","Recenter","Refocus","Rest"] }
  ];

  var RADII = [0, 100, 215, 355, 500];       // ring boundaries (viewBox units)
  var TINTS = [-0.05, 0.30, 0.15, -0.08];    // per ring: darker / lighter
  var TOTAL = DATA.reduce(function (s, w) { return s + w.r3.length; }, 0);
  var NAVY = "#14122B";
  var APP_NAME = "Feelings Wheel";

  function hexToRgb(h) {
    var n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mix(hex, t) {
    var c = hexToRgb(hex).map(function (v) {
      return Math.round(t >= 0 ? v + (255 - v) * t : v * (1 + t));
    });
    return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
  }

  // Wedge spans (degrees, clockwise from 12 o'clock)
  var acc = 0;
  DATA.forEach(function (w) {
    w.span = 360 * w.r3.length / TOTAL;
    w.a0 = acc;
    acc += w.span;
    w.cols = TINTS.map(function (t) { return mix(w.color, t); });
  });

  /* ------------------------------------------------------------------ */
  /* 1. App icon: drawn on an off-screen canvas, exported as PNG URIs    */
  /* ------------------------------------------------------------------ */
  function drawIcon(size) {
    var cv = document.createElement("canvas");
    cv.width = cv.height = size;
    var x = cv.getContext("2d");
    var s = size / 512;
    var cx = size / 2, cy = size / 2;

    var g = x.createRadialGradient(cx, cy * 0.8, 20 * s, cx, cy, 380 * s);
    g.addColorStop(0, "#241F4D");
    g.addColorStop(1, NAVY);
    x.fillStyle = g;
    x.fillRect(0, 0, size, size);

    // Keep the wheel inside the maskable safe zone (circle of 40% radius)
    var wheelR = 190 * s;
    DATA.forEach(function (w) {
      var a0 = (w.a0 - 90) * Math.PI / 180;
      var a1 = (w.a0 + w.span - 90) * Math.PI / 180;
      for (var ring = 3; ring >= 0; ring--) {
        var r1 = RADII[ring + 1] / 500 * wheelR;
        x.beginPath();
        x.moveTo(cx, cy);
        x.arc(cx, cy, r1, a0, a1, false);
        x.closePath();
        x.fillStyle = w.cols[ring];
        x.fill();
        x.lineWidth = Math.max(2, 4 * s);
        x.strokeStyle = NAVY;
        x.stroke();
      }
    });
    // centre dot
    x.beginPath();
    x.arc(cx, cy, 20 * s, 0, Math.PI * 2);
    x.fillStyle = NAVY;
    x.fill();
    x.beginPath();
    x.arc(cx, cy, 11 * s, 0, Math.PI * 2);
    x.fillStyle = "#FFFFFF";
    x.fill();

    return cv.toDataURL("image/png");
  }

  var icon512 = "", icon192 = "";
  try {
    icon512 = drawIcon(512);
    icon192 = drawIcon(192);
  } catch (e) { /* canvas unavailable: the app still works without the icon */ }

  function setLink(rel, attrs) {
    var el = document.querySelector('link[rel="' + rel + '"]');
    if (!el) { el = document.createElement("link"); el.rel = rel; document.head.appendChild(el); }
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  /* ------------------------------------------------------------------ */
  /* 2. iOS home screen support                                          */
  /* ------------------------------------------------------------------ */
  if (icon512) {
    setLink("apple-touch-icon", { href: icon512, sizes: "512x512" });
    setLink("icon", { href: icon192, type: "image/png", sizes: "192x192" });
    document.getElementById("hdrIcon").src = icon192;
  }

  /* ------------------------------------------------------------------ */
  /* 3. Web App Manifest from a Blob URL                                 */
  /* ------------------------------------------------------------------ */
  (function () {
    var web = /^https?:$/.test(location.protocol);
    // A blob: manifest cannot resolve "." against the page, so use absolute URLs when hosted.
    var startUrl = web ? location.origin + location.pathname : ".";
    var manifest = {
      name: APP_NAME,
      short_name: "Feelings",
      description: "An interactive feelings wheel.",
      start_url: startUrl,
      scope: web ? new URL(".", location.href).href : ".",
      display: "standalone",
      orientation: "any",
      background_color: NAVY,
      theme_color: NAVY,
      icons: icon512 ? [
        { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ] : []
    };
    try {
      var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      setLink("manifest", { href: URL.createObjectURL(blob) });
    } catch (e) { /* ignore */ }
  })();

  /* ------------------------------------------------------------------ */
  /* 4. Offline service worker (Blob first, ./sw.js as optional fallback) */
  /* ------------------------------------------------------------------ */
  var SW_SRC = [
    "var CACHE='feelings-wheel-v1';",
    "self.addEventListener('install',function(e){self.skipWaiting();",
    "e.waitUntil(caches.open(CACHE).then(function(c){return c.add(new Request(self.registration.scope,{cache:'reload'}));}).catch(function(){}));});",
    "self.addEventListener('activate',function(e){e.waitUntil(caches.keys().then(function(k){",
    "return Promise.all(k.filter(function(n){return n!==CACHE;}).map(function(n){return caches.delete(n);}));}).then(function(){return self.clients.claim();}));});",
    "self.addEventListener('fetch',function(e){if(e.request.method!=='GET')return;",
    "e.respondWith(fetch(e.request).then(function(r){if(r&&r.ok){var c=r.clone();caches.open(CACHE).then(function(ch){ch.put(e.request,c);});}return r;})",
    ".catch(function(){return caches.match(e.request).then(function(m){return m||caches.match(self.registration.scope);});}));});"
  ].join("\n");

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () {
      var blobUrl = URL.createObjectURL(new Blob([SW_SRC], { type: "text/javascript" }));
      navigator.serviceWorker.register(blobUrl).catch(function () {
        // Browsers require service worker scripts to be real same-origin files, so a blob: URL is usually
        // refused. If an optional sw.js sits next to index.html, use that instead.
        return fetch("sw.js", { method: "HEAD" }).then(function (r) {
          if (r.ok) return navigator.serviceWorker.register("sw.js");
        });
      }).catch(function () { /* the page is fully self-contained, so it still loads normally */ });
    });
  }

  /* Install prompt (Android / desktop Chrome) and iOS hint */
  var deferred = null;
  var installBtn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    installBtn.style.display = "inline-block";
  });
  installBtn.addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; installBtn.style.display = "none"; });
  });
  window.addEventListener("appinstalled", function () { installBtn.style.display = "none"; });
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (isIOS && !standalone) document.getElementById("ioshint").style.display = "block";

  /* ------------------------------------------------------------------ */
  /* The wheel                                                           */
  /* ------------------------------------------------------------------ */
  var svg = document.getElementById("wheel");
  var card = document.getElementById("card");

  function pol(r, a) {
    var rad = a * Math.PI / 180;
    return [r * Math.sin(rad), -r * Math.cos(rad)];
  }
  function f(n) { return n.toFixed(2); }
  function sector(r0, r1, a0, a1) {
    var p0 = pol(r1, a0), p1 = pol(r1, a1);
    var large = (a1 - a0) > 180 ? 1 : 0;
    if (r0 === 0) {
      return "M0 0L" + f(p0[0]) + " " + f(p0[1]) + "A" + r1 + " " + r1 + " 0 " + large + " 1 " + f(p1[0]) + " " + f(p1[1]) + "Z";
    }
    var p2 = pol(r0, a1), p3 = pol(r0, a0);
    return "M" + f(p0[0]) + " " + f(p0[1]) +
      "A" + r1 + " " + r1 + " 0 " + large + " 1 " + f(p1[0]) + " " + f(p1[1]) +
      "L" + f(p2[0]) + " " + f(p2[1]) +
      "A" + r0 + " " + r0 + " 0 " + large + " 0 " + f(p3[0]) + " " + f(p3[1]) + "Z";
  }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  var FONT = [20, 15, 14.5, 16];
  var html = "";
  DATA.forEach(function (w, ci) {
    function seg(ring, i, a0, a1, label) {
      var mid = (a0 + a1) / 2;
      var rm = (RADII[ring] + RADII[ring + 1]) / 2;
      if (ring === 0) rm = 62;
      var p = pol(rm, mid);
      var rot = mid - 90 + (mid > 180 ? 180 : 0);
      html += '<g class="seg' + (ring === 0 ? " core" : "") + '" data-c="' + ci + '" data-r="' + ring + '" data-i="' + i + '">' +
        '<path d="' + sector(RADII[ring], RADII[ring + 1], a0, a1) + '" fill="' + w.cols[ring] + '"/>' +
        '<text transform="translate(' + f(p[0]) + " " + f(p[1]) + ") rotate(" + f(rot) + ')" text-anchor="middle" dominant-baseline="central" font-size="' + FONT[ring] + '">' +
        esc(label) + "</text></g>";
    }
    seg(0, 0, w.a0, w.a0 + w.span, w.name);
    [[w.r2, 1], [w.r3, 2], [w.r4, 3]].forEach(function (pair) {
      var items = pair[0], ring = pair[1], step = w.span / items.length;
      items.forEach(function (label, i) {
        seg(ring, i, w.a0 + i * step, w.a0 + (i + 1) * step, label);
      });
    });
  });
  svg.innerHTML = html;

  /* Selection state and card */
  var sel = null;

  function applySelection() {
    var segs = svg.querySelectorAll(".seg");
    for (var k = 0; k < segs.length; k++) {
      var el = segs[k], c = +el.dataset.c, r = +el.dataset.r, i = +el.dataset.i;
      var cls = "seg" + (r === 0 ? " core" : "");
      if (sel) {
        if (c !== sel.c) cls += " dim";
        else {
          var on = false, soft = false;
          if (sel.r === 0) { on = r === 0; }
          else if (sel.r === 1) {
            on = r === 0 || (r === 1 && i === sel.i) || (r === 2 && Math.floor(i / 2) === sel.i);
            soft = !on;
          } else if (sel.r === 2) {
            on = r === 0 || (r === 2 && i === sel.i) || (r === 1 && i === Math.floor(sel.i / 2));
            soft = !on;
          } else {
            on = r === 0 || (r === 3 && i === sel.i);
          }
          if (on) cls += " on"; else if (soft) cls += " soft";
        }
      }
      el.setAttribute("class", cls);
    }
  }

  function chip(label, c, r, i, pressed) {
    return '<button type="button" class="chip" style="background:' + DATA[c].color +
      '" data-c="' + c + '" data-r="' + r + '" data-i="' + i + '" aria-pressed="' + (pressed ? "true" : "false") + '">' + esc(label) + "</button>";
  }

  function renderCard() {
    if (!sel) {
      card.innerHTML = '<h2>Start with the big picture</h2>' +
        '<p class="lead">Pick the core feeling that fits best. Then narrow it down to a word that feels exact.</p>' +
        '<div class="chips">' + DATA.map(function (w, c) { return chip(w.name, c, 0, 0, false); }).join("") + "</div>";
      return;
    }
    var w = DATA[sel.c], out = "", title, crumbs = "", lead = "", kids = "", kidsTitle = "";

    if (sel.r === 0) {
      title = w.name;
      lead = "A core feeling. Choose a more specific word to go deeper.";
      kidsTitle = "Feelings under " + w.name.toLowerCase();
      kids = w.r2.map(function (l, i) { return chip(l, sel.c, 1, i, false); }).join("");
    } else if (sel.r === 1) {
      title = w.r2[sel.i];
      crumbs = w.name;
      lead = "Is one of these closer to what you feel?";
      kidsTitle = "Finer shades";
      kids = [2 * sel.i, 2 * sel.i + 1].map(function (j) { return chip(w.r3[j], sel.c, 2, j, false); }).join("");
    } else if (sel.r === 2) {
      title = w.r3[sel.i];
      crumbs = w.name + " › " + w.r2[Math.floor(sel.i / 2)];
      lead = "That is a precise word for it. Ready to do something with it?";
    } else {
      title = w.r4[sel.i];
      crumbs = w.name;
      lead = "A next step that often helps with feeling " + w.name.toLowerCase() + ".";
    }

    out += (crumbs ? '<p class="crumbs">' + esc(crumbs) + "</p>" : "") + "<h2>" + esc(title) + "</h2>" +
      '<p class="lead">' + esc(lead) + "</p>";
    if (kids) out += "<h3>" + esc(kidsTitle) + '</h3><div class="chips">' + kids + "</div>";
    out += "<h3>Ideas for " + esc(w.name.toLowerCase()) + ' moments</h3><div class="chips">' +
      w.r4.map(function (l, i) { return chip(l, sel.c, 3, i, sel.r === 3 && sel.i === i); }).join("") + "</div>";
    out += '<h3>Back to</h3><div class="chips">' +
      '<button type="button" class="chip" style="background:#5E5B78" data-reset="1">All core feelings</button></div>';
    card.innerHTML = out;
  }

  function select(c, r, i) {
    sel = { c: c, r: r, i: i };
    applySelection();
    renderCard();
  }

  svg.addEventListener("click", function (e) {
    var g = e.target.closest(".seg");
    if (g) select(+g.dataset.c, +g.dataset.r, +g.dataset.i);
  });
  card.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.reset) { sel = null; applySelection(); renderCard(); return; }
    select(+b.dataset.c, +b.dataset.r, +b.dataset.i);
  });

  /* Zoom */
  var steps = [1, 1.7, 2.5, 3.5], zi = 0;
  var stage = document.getElementById("stage");
  var zin = document.getElementById("zin"), zout = document.getElementById("zout");
  function setZoom(n) {
    var cxr = (stage.scrollLeft + stage.clientWidth / 2) / (stage.scrollWidth || 1);
    var cyr = (stage.scrollTop + stage.clientHeight / 2) / (stage.scrollHeight || 1);
    zi = Math.max(0, Math.min(steps.length - 1, n));
    svg.style.width = (steps[zi] * 100) + "%";
    stage.scrollLeft = cxr * stage.scrollWidth - stage.clientWidth / 2;
    stage.scrollTop = cyr * stage.scrollHeight - stage.clientHeight / 2;
    zout.disabled = zi === 0;
    zin.disabled = zi === steps.length - 1;
  }
  zin.addEventListener("click", function () { setZoom(zi + 1); });
  zout.addEventListener("click", function () { setZoom(zi - 1); });
  setZoom(0);

  renderCard();
})();
</script>
</body>
</html>
